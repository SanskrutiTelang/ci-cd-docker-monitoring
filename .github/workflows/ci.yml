name: CI - Test and Build Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t ci-cd-task-manager:${{ github.sha }} .

      - name: Verify Docker image exists
        run: docker image inspect ci-cd-task-manager:${{ github.sha }}
